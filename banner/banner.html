<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=block" rel="stylesheet">
<style>
  :root {
    --fg: #131b17;
    --bg: #f6f6f0;
    --mint: #6fd39c;
    --lime: #c9ec8f;
  }
  html, body { margin: 0; background: var(--fg); }
  #stage {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    background: var(--fg);
    color: var(--bg);
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
  }
  .grain {
    position: absolute;
    inset: 0;
    z-index: -1;
    background-image: url(noise.webp);
    background-size: 96px;
    mix-blend-mode: overlay;
    opacity: 0.42;
  }
  h1 {
    position: absolute;
    inset: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-synthesis: none;
    letter-spacing: -0.02em;
    line-height: 0.95;
    white-space: nowrap;
  }
  em {
    background: linear-gradient(to right, var(--lime), var(--mint));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-right: 0.06em;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gradient"></canvas>
  <div class="grain"></div>
  <h1>Dylan&nbsp;<em>Mendiboure</em></h1>
</div>
<script src="gradient.js"></script>
</body>
</html>
